<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AP Hold Release Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#0b1020',
            panel: '#131a2b',
            panelSoft: '#1a2338',
            accent: '#22d3ee',
            success: '#10b981',
            warn: '#f59e0b',
            danger: '#ef4444'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-bg text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <a href="../../index.html" class="text-cyan-300 hover:text-cyan-200 text-sm font-semibold">BackOfficeBites 🍔</a>

    <header class="bg-panel border border-slate-800 rounded-2xl p-5 space-y-4">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight">AP Hold Release Kanban</h1>
          <p class="text-slate-300 mt-1">Finance workflow board for blocked invoices, policy checks, approvals, and release readiness.</p>
        </div>
        <div class="flex items-center gap-3">
          <label for="roleSelect" class="text-sm text-slate-300">Role</label>
          <select id="roleSelect" class="bg-panelSoft border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option>Analyst</option>
            <option>Controller</option>
            <option>Audit</option>
          </select>
          <button id="exportBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-900 font-semibold px-3 py-2 rounded-lg text-sm">Export CSV</button>
        </div>
      </div>

      <div id="roleHint" class="text-xs text-cyan-200"></div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <div class="bg-panelSoft border border-slate-700 rounded-xl p-3">
          <div class="text-xs text-slate-400">Open Holds</div>
          <div id="kpiOpen" class="text-2xl font-bold">0</div>
        </div>
        <div class="bg-panelSoft border border-slate-700 rounded-xl p-3">
          <div class="text-xs text-slate-400">Blocked Amount</div>
          <div id="kpiAmount" class="text-2xl font-bold">€0</div>
        </div>
        <div class="bg-panelSoft border border-slate-700 rounded-xl p-3">
          <div class="text-xs text-slate-400">Ready to Pay</div>
          <div id="kpiReady" class="text-2xl font-bold text-emerald-300">0</div>
        </div>
        <div class="bg-panelSoft border border-slate-700 rounded-xl p-3">
          <div class="text-xs text-slate-400">Released Today</div>
          <div id="kpiReleased" class="text-2xl font-bold text-cyan-300">0</div>
        </div>
      </div>
    </header>

    <section class="bg-panel border border-slate-800 rounded-2xl p-4 space-y-4">
      <div class="grid md:grid-cols-5 gap-3">
        <div>
          <label for="searchInput" class="text-xs text-slate-400">Search</label>
          <input id="searchInput" type="text" placeholder="Invoice, vendor, owner" class="w-full mt-1 bg-panelSoft border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label for="reasonFilter" class="text-xs text-slate-400">Hold reason</label>
          <select id="reasonFilter" class="w-full mt-1 bg-panelSoft border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="all">All reasons</option>
            <option value="3-way mismatch">3-way mismatch</option>
            <option value="Missing PO">Missing PO</option>
            <option value="Duplicate invoice">Duplicate invoice</option>
            <option value="Tax validation">Tax validation</option>
            <option value="Vendor banking">Vendor banking</option>
          </select>
        </div>
        <div>
          <label for="ownerFilter" class="text-xs text-slate-400">Owner</label>
          <select id="ownerFilter" class="w-full mt-1 bg-panelSoft border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="all">All owners</option>
          </select>
        </div>
        <div>
          <label for="sortBy" class="text-xs text-slate-400">Sort</label>
          <select id="sortBy" class="w-full mt-1 bg-panelSoft border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent">
            <option value="dueAsc">Due date (soonest)</option>
            <option value="amountDesc">Amount (high to low)</option>
            <option value="riskDesc">Risk score (high to low)</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="newTicketBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold px-3 py-2 rounded-lg text-sm">New Hold Ticket</button>
        </div>
      </div>

      <form id="ticketForm" class="hidden bg-panelSoft border border-slate-700 rounded-xl p-4 space-y-3" novalidate>
        <h2 class="font-semibold">Create Hold Ticket</h2>
        <div class="grid md:grid-cols-3 gap-3">
          <div>
            <label for="fInvoice" class="text-xs text-slate-300">Invoice #</label>
            <input id="fInvoice" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm" placeholder="INV-7781" />
          </div>
          <div>
            <label for="fVendor" class="text-xs text-slate-300">Vendor</label>
            <input id="fVendor" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm" placeholder="Northline Logistics" />
          </div>
          <div>
            <label for="fOwner" class="text-xs text-slate-300">Owner</label>
            <input id="fOwner" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm" placeholder="Mina" />
          </div>
          <div>
            <label for="fAmount" class="text-xs text-slate-300">Amount (€)</label>
            <input id="fAmount" type="number" min="0" step="0.01" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm" placeholder="12500" />
          </div>
          <div>
            <label for="fDue" class="text-xs text-slate-300">Due date</label>
            <input id="fDue" type="date" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label for="fReason" class="text-xs text-slate-300">Reason</label>
            <select id="fReason" class="w-full mt-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm">
              <option value="">Choose reason</option>
              <option>3-way mismatch</option>
              <option>Missing PO</option>
              <option>Duplicate invoice</option>
              <option>Tax validation</option>
              <option>Vendor banking</option>
            </select>
          </div>
        </div>
        <p id="formError" class="text-sm text-rose-300 hidden"></p>
        <div class="flex gap-2">
          <button type="submit" class="bg-emerald-500 hover:bg-emerald-400 text-slate-900 font-semibold px-3 py-2 rounded-lg text-sm">Create ticket</button>
          <button type="button" id="cancelTicketBtn" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-sm">Cancel</button>
        </div>
      </form>
    </section>

    <section id="board" class="grid lg:grid-cols-5 gap-4"></section>

    <section class="bg-panel border border-slate-800 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Audit Trail</h2>
        <span class="text-xs text-slate-400">Newest first, last 20 events</span>
      </div>
      <ul id="auditList" class="space-y-2 text-sm"></ul>
    </section>
  </div>

  <script>
    const lanes = [
      { key: 'new', label: 'New Hold', tone: 'text-slate-200' },
      { key: 'followup', label: 'Vendor Follow-up', tone: 'text-amber-200' },
      { key: 'policy', label: 'Policy Review', tone: 'text-violet-200' },
      { key: 'ready', label: 'Ready to Pay', tone: 'text-emerald-200' },
      { key: 'released', label: 'Released', tone: 'text-cyan-200' }
    ];

    const laneTitles = Object.fromEntries(lanes.map(l => [l.key, l.label]));

    let tickets = [
      { id: 'H-2401', invoice: 'INV-7712', vendor: 'Nordic Steel GmbH', owner: 'Mina', amount: 18450, due: '2026-05-27', reason: '3-way mismatch', status: 'new', risk: 88, policyOk: false, vendorResponse: false, approvals: 0, createdAt: '2026-05-24T07:12:00Z' },
      { id: 'H-2402', invoice: 'INV-7718', vendor: 'Apex Fleet Services', owner: 'Jon', amount: 6200, due: '2026-05-26', reason: 'Vendor banking', status: 'followup', risk: 72, policyOk: false, vendorResponse: true, approvals: 0, createdAt: '2026-05-24T08:05:00Z' },
      { id: 'H-2403', invoice: 'INV-7720', vendor: 'KraftLine Packaging', owner: 'Sara', amount: 14120, due: '2026-05-29', reason: 'Tax validation', status: 'policy', risk: 64, policyOk: true, vendorResponse: true, approvals: 1, createdAt: '2026-05-24T08:41:00Z' },
      { id: 'H-2404', invoice: 'INV-7723', vendor: 'Helios Data Center Ops', owner: 'Mina', amount: 23980, due: '2026-05-25', reason: 'Missing PO', status: 'ready', risk: 95, policyOk: true, vendorResponse: true, approvals: 2, createdAt: '2026-05-24T09:22:00Z' },
      { id: 'H-2398', invoice: 'INV-7699', vendor: 'Southgate Energy', owner: 'Luca', amount: 9050, due: '2026-05-22', reason: 'Duplicate invoice', status: 'released', risk: 35, policyOk: true, vendorResponse: true, approvals: 2, createdAt: '2026-05-23T14:03:00Z' }
    ];

    let audit = [
      'Controller moved H-2398 to Released.',
      'Analyst added banking evidence to H-2402.',
      'Controller approved policy gate for H-2404.'
    ];

    const state = {
      role: 'Analyst',
      search: '',
      reason: 'all',
      owner: 'all',
      sortBy: 'dueAsc'
    };

    const roleRules = {
      Analyst: {
        canCreate: true,
        canMoveTo: ['new', 'followup', 'policy']
      },
      Controller: {
        canCreate: true,
        canMoveTo: ['followup', 'policy', 'ready', 'released']
      },
      Audit: {
        canCreate: false,
        canMoveTo: []
      }
    };

    const transitions = {
      new: ['followup', 'policy'],
      followup: ['policy', 'new'],
      policy: ['ready', 'followup'],
      ready: ['released', 'policy'],
      released: []
    };

    const boardEl = document.getElementById('board');
    const auditListEl = document.getElementById('auditList');

    const roleSelect = document.getElementById('roleSelect');
    const roleHint = document.getElementById('roleHint');
    const searchInput = document.getElementById('searchInput');
    const reasonFilter = document.getElementById('reasonFilter');
    const ownerFilter = document.getElementById('ownerFilter');
    const sortBy = document.getElementById('sortBy');

    const newTicketBtn = document.getElementById('newTicketBtn');
    const ticketForm = document.getElementById('ticketForm');
    const cancelTicketBtn = document.getElementById('cancelTicketBtn');
    const formError = document.getElementById('formError');

    const exportBtn = document.getElementById('exportBtn');

    const money = value => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(value);

    const fmtDate = d => new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'short' }).format(new Date(d + 'T00:00:00'));

    function addAudit(line) {
      const stamp = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      audit.unshift(`${stamp} · ${line}`);
      audit = audit.slice(0, 20);
      renderAudit();
    }

    function populateOwners() {
      const owners = [...new Set(tickets.map(t => t.owner))].sort((a, b) => a.localeCompare(b));
      const current = ownerFilter.value || 'all';
      ownerFilter.innerHTML = '<option value="all">All owners</option>' + owners.map(o => `<option value="${o}">${o}</option>`).join('');
      ownerFilter.value = owners.includes(current) ? current : 'all';
      state.owner = ownerFilter.value;
    }

    function policyMessage(ticket, target) {
      if (target === 'ready' && (!ticket.policyOk || !ticket.vendorResponse)) {
        return 'Ready to Pay requires vendor response and policy check.';
      }
      if (target === 'released') {
        if (!ticket.policyOk || !ticket.vendorResponse || ticket.approvals < 2) {
          return 'Release requires policy OK, vendor response, and 2 approvals.';
        }
      }
      return null;
    }

    function canMove(ticket, target) {
      const role = roleRules[state.role];
      if (!role.canMoveTo.includes(target)) return false;
      if (!transitions[ticket.status].includes(target)) return false;
      return !policyMessage(ticket, target);
    }

    function filteredTickets() {
      const q = state.search.trim().toLowerCase();
      const rows = tickets.filter(t => {
        if (state.reason !== 'all' && t.reason !== state.reason) return false;
        if (state.owner !== 'all' && t.owner !== state.owner) return false;
        if (q) {
          const text = `${t.id} ${t.invoice} ${t.vendor} ${t.owner}`.toLowerCase();
          if (!text.includes(q)) return false;
        }
        return true;
      });

      rows.sort((a, b) => {
        if (state.sortBy === 'amountDesc') return b.amount - a.amount;
        if (state.sortBy === 'riskDesc') return b.risk - a.risk;
        return new Date(a.due) - new Date(b.due);
      });

      return rows;
    }

    function renderKPIs(rows) {
      document.getElementById('kpiOpen').textContent = rows.filter(r => r.status !== 'released').length;
      document.getElementById('kpiAmount').textContent = money(rows.filter(r => r.status !== 'released').reduce((sum, r) => sum + r.amount, 0));
      document.getElementById('kpiReady').textContent = rows.filter(r => r.status === 'ready').length;
      document.getElementById('kpiReleased').textContent = rows.filter(r => r.status === 'released').length;
    }

    function renderBoard() {
      const rows = filteredTickets();
      renderKPIs(rows);

      boardEl.innerHTML = lanes.map(lane => {
        const laneRows = rows.filter(r => r.status === lane.key);
        return `
          <section class="bg-panel border border-slate-800 rounded-2xl p-3 flex flex-col min-h-[380px]" data-lane="${lane.key}">
            <div class="flex items-center justify-between mb-2">
              <h2 class="font-semibold ${lane.tone}">${lane.label}</h2>
              <span class="text-xs bg-slate-800 border border-slate-700 px-2 py-1 rounded-full">${laneRows.length}</span>
            </div>
            <div class="space-y-3 flex-1 lane-drop" data-lane-drop="${lane.key}" tabindex="0" aria-label="${lane.label} lane">
              ${laneRows.map(cardTemplate).join('') || '<div class="text-xs text-slate-500 border border-dashed border-slate-700 rounded-xl p-4">No tickets</div>'}
            </div>
          </section>`;
      }).join('');

      bindBoardEvents();
      updateRoleHint();
    }

    function cardTemplate(t) {
      const riskTone = t.risk >= 85 ? 'text-rose-300' : t.risk >= 60 ? 'text-amber-300' : 'text-emerald-300';
      const next = transitions[t.status][0];
      const moveBlocked = !next || !canMove(t, next);
      const amountText = state.role === 'Audit' ? 'Restricted' : money(t.amount);

      return `
      <article class="bg-panelSoft border border-slate-700 rounded-xl p-3 space-y-2" draggable="${state.role !== 'Audit'}" data-ticket-id="${t.id}" tabindex="0">
        <div class="flex items-start justify-between gap-2">
          <div>
            <p class="text-xs text-slate-400">${t.id} · ${t.invoice}</p>
            <h3 class="font-semibold leading-tight">${t.vendor}</h3>
          </div>
          <span class="text-xs px-2 py-1 rounded-full bg-slate-800 border border-slate-700">${t.owner}</span>
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div class="bg-slate-900/70 rounded-lg px-2 py-1 border border-slate-700">Amount: <b>${amountText}</b></div>
          <div class="bg-slate-900/70 rounded-lg px-2 py-1 border border-slate-700">Due: <b>${fmtDate(t.due)}</b></div>
          <div class="bg-slate-900/70 rounded-lg px-2 py-1 border border-slate-700">Reason: <b>${t.reason}</b></div>
          <div class="bg-slate-900/70 rounded-lg px-2 py-1 border border-slate-700">Risk: <b class="${riskTone}">${t.risk}</b></div>
        </div>
        <div class="flex flex-wrap gap-1 text-[11px]">
          <span class="px-2 py-0.5 rounded-full ${t.policyOk ? 'bg-emerald-900/60 text-emerald-200 border border-emerald-700' : 'bg-rose-900/50 text-rose-200 border border-rose-700'}">Policy ${t.policyOk ? 'OK' : 'Pending'}</span>
          <span class="px-2 py-0.5 rounded-full ${t.vendorResponse ? 'bg-cyan-900/60 text-cyan-200 border border-cyan-700' : 'bg-slate-800 text-slate-300 border border-slate-600'}">Vendor ${t.vendorResponse ? 'Confirmed' : 'No reply'}</span>
          <span class="px-2 py-0.5 rounded-full bg-violet-900/50 text-violet-200 border border-violet-700">Approvals ${t.approvals}/2</span>
        </div>
        <div class="flex gap-2">
          <button data-next="${t.id}" class="flex-1 text-xs rounded-lg px-2 py-1.5 border ${moveBlocked ? 'border-slate-700 text-slate-500 cursor-not-allowed' : 'border-cyan-700 text-cyan-200 hover:bg-cyan-900/30'}" ${moveBlocked ? 'disabled' : ''}>Move → ${next ? laneTitles[next] : 'Done'}</button>
          <button data-toggle="${t.id}" class="text-xs rounded-lg px-2 py-1.5 border border-slate-700 hover:bg-slate-700/60">+Approval</button>
        </div>
      </article>`;
    }

    function bindBoardEvents() {
      document.querySelectorAll('[data-ticket-id]').forEach(card => {
        card.addEventListener('dragstart', ev => {
          if (state.role === 'Audit') {
            ev.preventDefault();
            return;
          }
          ev.dataTransfer.setData('text/plain', card.dataset.ticketId);
        });
      });

      document.querySelectorAll('[data-lane-drop]').forEach(zone => {
        zone.addEventListener('dragover', ev => {
          ev.preventDefault();
          zone.classList.add('ring-2', 'ring-cyan-500/60', 'rounded-xl');
        });
        zone.addEventListener('dragleave', () => zone.classList.remove('ring-2', 'ring-cyan-500/60', 'rounded-xl'));
        zone.addEventListener('drop', ev => {
          ev.preventDefault();
          zone.classList.remove('ring-2', 'ring-cyan-500/60', 'rounded-xl');
          const id = ev.dataTransfer.getData('text/plain');
          moveTicket(id, zone.dataset.laneDrop);
        });
      });

      document.querySelectorAll('[data-next]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.next;
          const t = tickets.find(x => x.id === id);
          if (!t) return;
          const target = transitions[t.status][0];
          if (target) moveTicket(id, target);
        });
      });

      document.querySelectorAll('[data-toggle]').forEach(btn => {
        btn.addEventListener('click', () => {
          const ticket = tickets.find(t => t.id === btn.dataset.toggle);
          if (!ticket) return;
          ticket.approvals = Math.min(2, ticket.approvals + 1);
          if (ticket.approvals >= 1) ticket.policyOk = true;
          if (ticket.approvals >= 2) ticket.vendorResponse = true;
          addAudit(`${state.role} added approval on ${ticket.id} (${ticket.approvals}/2).`);
          renderBoard();
        });
      });
    }

    function moveTicket(id, target) {
      const ticket = tickets.find(t => t.id === id);
      if (!ticket || ticket.status === target) return;

      if (!transitions[ticket.status].includes(target)) {
        addAudit(`Blocked invalid transition ${ticket.id}: ${laneTitles[ticket.status]} → ${laneTitles[target]}.`);
        return;
      }

      const role = roleRules[state.role];
      if (!role.canMoveTo.includes(target)) {
        addAudit(`Blocked by role policy: ${state.role} cannot move ${ticket.id} to ${laneTitles[target]}.`);
        return;
      }

      const gate = policyMessage(ticket, target);
      if (gate) {
        addAudit(`Policy blocked ${ticket.id}: ${gate}`);
        return;
      }

      const from = ticket.status;
      ticket.status = target;
      addAudit(`${state.role} moved ${ticket.id} from ${laneTitles[from]} to ${laneTitles[target]}.`);
      renderBoard();
    }

    function renderAudit() {
      auditListEl.innerHTML = audit.map(line => `<li class="bg-panelSoft border border-slate-700 rounded-lg px-3 py-2">${line}</li>`).join('');
    }

    function updateRoleHint() {
      const hints = {
        Analyst: 'Analyst view: create tickets and progress early investigation lanes.',
        Controller: 'Controller view: finalize policy checks and release payment-ready invoices.',
        Audit: 'Audit view: read-only board for oversight and evidence review.'
      };
      roleHint.textContent = hints[state.role];
      newTicketBtn.disabled = !roleRules[state.role].canCreate;
      newTicketBtn.classList.toggle('opacity-40', !roleRules[state.role].canCreate);
      newTicketBtn.classList.toggle('cursor-not-allowed', !roleRules[state.role].canCreate);
    }

    function toCSV(rows) {
      const head = ['id','invoice','vendor','owner','amount','due','reason','status','risk','policyOk','vendorResponse','approvals'];
      const esc = v => `"${String(v).replaceAll('"','""')}"`;
      const lines = [head.join(',')].concat(rows.map(r => [
        r.id, r.invoice, r.vendor, r.owner, r.amount, r.due, r.reason, laneTitles[r.status], r.risk, r.policyOk, r.vendorResponse, r.approvals
      ].map(esc).join(',')));
      return lines.join('\n');
    }

    roleSelect.addEventListener('change', () => {
      state.role = roleSelect.value;
      renderBoard();
    });

    searchInput.addEventListener('input', () => {
      state.search = searchInput.value;
      renderBoard();
    });

    reasonFilter.addEventListener('change', () => {
      state.reason = reasonFilter.value;
      renderBoard();
    });

    ownerFilter.addEventListener('change', () => {
      state.owner = ownerFilter.value;
      renderBoard();
    });

    sortBy.addEventListener('change', () => {
      state.sortBy = sortBy.value;
      renderBoard();
    });

    newTicketBtn.addEventListener('click', () => {
      if (!roleRules[state.role].canCreate) return;
      ticketForm.classList.toggle('hidden');
      formError.classList.add('hidden');
    });

    cancelTicketBtn.addEventListener('click', () => {
      ticketForm.classList.add('hidden');
      ticketForm.reset();
      formError.classList.add('hidden');
    });

    ticketForm.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const invoice = document.getElementById('fInvoice').value.trim();
      const vendor = document.getElementById('fVendor').value.trim();
      const owner = document.getElementById('fOwner').value.trim();
      const amount = Number(document.getElementById('fAmount').value);
      const due = document.getElementById('fDue').value;
      const reason = document.getElementById('fReason').value;

      if (!invoice || !vendor || !owner || !due || !reason || !Number.isFinite(amount) || amount <= 0) {
        formError.textContent = 'Fill every field and use a positive amount.';
        formError.classList.remove('hidden');
        return;
      }

      const id = `H-${Math.floor(2400 + Math.random() * 500)}`;
      tickets.unshift({
        id,
        invoice,
        vendor,
        owner,
        amount,
        due,
        reason,
        status: 'new',
        risk: Math.min(99, Math.max(20, Math.round((amount / 500) + 30))),
        policyOk: false,
        vendorResponse: false,
        approvals: 0,
        createdAt: new Date().toISOString()
      });

      addAudit(`${state.role} created ${id} for ${invoice} (${vendor}).`);
      ticketForm.reset();
      ticketForm.classList.add('hidden');
      formError.classList.add('hidden');
      populateOwners();
      renderBoard();
    });

    exportBtn.addEventListener('click', () => {
      const csv = toCSV(filteredTickets());
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ap-hold-release-board.csv';
      a.click();
      URL.revokeObjectURL(url);
      addAudit(`${state.role} exported current filtered board as CSV.`);
    });

    populateOwners();
    renderBoard();
    renderAudit();
  </script>
</body>
</html>
