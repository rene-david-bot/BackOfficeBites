<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compliance Checklist Evidence Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-7xl mx-auto p-4 md:p-6 space-y-4">
    <a href="../../index.html" class="text-xs text-emerald-400 hover:text-emerald-300 underline underline-offset-2">BackOfficeBites 🍔</a>
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">Compliance Checklist Evidence Desk</h1>
        <p class="text-slate-400">Legal master-detail workspace for policy validation, staged approvals, and audit-ready evidence logs.</p>
      </div>
      <div class="flex items-end gap-2">
        <label class="text-xs text-slate-300">
          Role
          <select id="roleSelect" class="block mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm">
            <option>Analyst</option>
            <option>Approver</option>
            <option>Admin</option>
          </select>
        </label>
        <button id="exportBtn" class="bg-emerald-600 hover:bg-emerald-500 rounded px-3 py-2 text-sm font-medium">Export CSV</button>
      </div>
    </div>

    <div class="grid grid-cols-1 xl:grid-cols-12 gap-4">
      <aside class="xl:col-span-5 bg-slate-900/60 border border-slate-800 rounded-xl p-3 space-y-3">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <label class="text-xs text-slate-300">Search
            <input id="searchInput" type="search" placeholder="Checklist, owner, regulation" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded px-2 py-2 text-sm" />
          </label>
          <label class="text-xs text-slate-300">Status
            <select id="statusFilter" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded px-2 py-2 text-sm">
              <option value="">All</option>
              <option>Draft</option>
              <option>Under Review</option>
              <option>Approved</option>
              <option>Rejected</option>
              <option>Archived</option>
            </select>
          </label>
          <label class="text-xs text-slate-300">Risk
            <select id="riskFilter" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded px-2 py-2 text-sm">
              <option value="">All</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Critical</option>
            </select>
          </label>
          <label class="text-xs text-slate-300">Sort By
            <select id="sortBy" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded px-2 py-2 text-sm">
              <option value="dueAsc">Due Date (soonest)</option>
              <option value="riskDesc">Risk (highest)</option>
              <option value="nameAsc">Name (A-Z)</option>
            </select>
          </label>
        </div>

        <div id="listCount" class="text-xs text-slate-400"></div>
        <div id="checklistList" class="space-y-2 max-h-[62vh] overflow-auto pr-1" tabindex="0" aria-label="Checklist items"></div>
      </aside>

      <main class="xl:col-span-7 bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-4">
        <div id="emptyState" class="text-slate-400 text-sm">Select a checklist item from the left to inspect evidence and route approvals.</div>

        <section id="detailSection" class="hidden space-y-4">
          <div class="flex flex-wrap items-start justify-between gap-2">
            <div>
              <h2 id="detailTitle" class="text-xl font-semibold"></h2>
              <p id="detailMeta" class="text-sm text-slate-400"></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button id="submitBtn" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-500 text-sm">Submit</button>
              <button id="approveBtn" class="px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-500 text-sm">Approve</button>
              <button id="rejectBtn" class="px-3 py-2 rounded bg-rose-600 hover:bg-rose-500 text-sm">Reject</button>
              <button id="archiveBtn" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">Archive</button>
            </div>
          </div>

          <div id="policyBox" class="border rounded-lg p-3 text-sm"></div>

          <div class="grid md:grid-cols-2 gap-4">
            <section class="bg-slate-950 border border-slate-800 rounded-lg p-3">
              <h3 class="font-medium mb-2">Add evidence</h3>
              <form id="evidenceForm" class="space-y-2" novalidate>
                <label class="text-xs text-slate-300 block">Evidence type
                  <select id="evidenceType" required class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm">
                    <option value="">Choose…</option>
                    <option>Policy Document</option>
                    <option>Training Log</option>
                    <option>Signed Acknowledgment</option>
                    <option>Screen Capture</option>
                    <option>Audit Record</option>
                  </select>
                </label>
                <label class="text-xs text-slate-300 block">Reference ID
                  <input id="evidenceRef" required minlength="4" placeholder="e.g. DOC-2391" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm" />
                </label>
                <label class="text-xs text-slate-300 block">Notes
                  <textarea id="evidenceNotes" rows="2" placeholder="What proves control effectiveness?" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm"></textarea>
                </label>
                <p id="formError" class="text-xs text-rose-400 hidden"></p>
                <button class="w-full bg-indigo-600 hover:bg-indigo-500 rounded px-3 py-2 text-sm font-medium">Add Evidence</button>
              </form>
            </section>

            <section class="bg-slate-950 border border-slate-800 rounded-lg p-3">
              <h3 class="font-medium mb-2">Evidence log</h3>
              <ul id="evidenceList" class="space-y-2 text-sm max-h-52 overflow-auto pr-1"></ul>
            </section>
          </div>

          <section class="bg-slate-950 border border-slate-800 rounded-lg p-3">
            <h3 class="font-medium mb-2">Audit trail</h3>
            <ul id="auditList" class="space-y-2 text-xs text-slate-300 max-h-56 overflow-auto pr-1"></ul>
          </section>
        </section>
      </main>
    </div>
  </div>

  <script>
    const todayIso = "2026-05-30";
    const riskWeight = { Low: 1, Medium: 2, High: 3, Critical: 4 };

    const state = {
      role: "Analyst",
      selectedId: null,
      items: [
        {
          id: 1,
          checklist: "GDPR Article 30 Records",
          regulation: "GDPR",
          owner: "Lena M.",
          team: "Privacy Ops",
          risk: "High",
          dueDate: "2026-06-03",
          status: "Under Review",
          evidence: [
            { type: "Policy Document", ref: "POL-8891", notes: "Updated RoPA template", at: "2026-05-27 09:14" },
            { type: "Audit Record", ref: "AUD-1042", notes: "Sample control walkthrough", at: "2026-05-28 16:40" }
          ],
          audit: [
            { at: "2026-05-26 10:00", actor: "Lena M.", action: "Created checklist item" },
            { at: "2026-05-27 09:15", actor: "Lena M.", action: "Added policy evidence POL-8891" },
            { at: "2026-05-28 16:41", actor: "Timo K.", action: "Submitted for review" }
          ]
        },
        {
          id: 2,
          checklist: "SOX Access Recertification",
          regulation: "SOX",
          owner: "Marta S.",
          team: "Internal Controls",
          risk: "Critical",
          dueDate: "2026-05-31",
          status: "Draft",
          evidence: [
            { type: "Training Log", ref: "TRN-5508", notes: "Approver training complete", at: "2026-05-29 13:22" }
          ],
          audit: [
            { at: "2026-05-29 11:20", actor: "Marta S.", action: "Created checklist item" }
          ]
        },
        {
          id: 3,
          checklist: "ISO 27001 Vendor Risk Review",
          regulation: "ISO 27001",
          owner: "Jan R.",
          team: "Security Governance",
          risk: "Medium",
          dueDate: "2026-06-12",
          status: "Approved",
          evidence: [
            { type: "Signed Acknowledgment", ref: "ACK-3201", notes: "Vendor owner sign-off", at: "2026-05-25 11:06" },
            { type: "Screen Capture", ref: "CAP-7712", notes: "System configuration proof", at: "2026-05-25 11:20" },
            { type: "Audit Record", ref: "AUD-9903", notes: "Control tested pass", at: "2026-05-26 15:09" }
          ],
          audit: [
            { at: "2026-05-24 09:05", actor: "Jan R.", action: "Created checklist item" },
            { at: "2026-05-26 15:10", actor: "Nadia P.", action: "Approved" }
          ]
        },
        {
          id: 4,
          checklist: "Whistleblower Policy Acknowledgments",
          regulation: "EU Directive 2019/1937",
          owner: "Elif T.",
          team: "Legal Ops",
          risk: "Low",
          dueDate: "2026-06-20",
          status: "Rejected",
          evidence: [
            { type: "Signed Acknowledgment", ref: "ACK-9004", notes: "32/40 received", at: "2026-05-22 14:01" }
          ],
          audit: [
            { at: "2026-05-22 14:01", actor: "Elif T.", action: "Submitted for review" },
            { at: "2026-05-23 09:45", actor: "Nadia P.", action: "Rejected (insufficient completion rate)" }
          ]
        }
      ]
    };

    const el = {
      roleSelect: document.getElementById("roleSelect"),
      searchInput: document.getElementById("searchInput"),
      statusFilter: document.getElementById("statusFilter"),
      riskFilter: document.getElementById("riskFilter"),
      sortBy: document.getElementById("sortBy"),
      checklistList: document.getElementById("checklistList"),
      listCount: document.getElementById("listCount"),
      emptyState: document.getElementById("emptyState"),
      detailSection: document.getElementById("detailSection"),
      detailTitle: document.getElementById("detailTitle"),
      detailMeta: document.getElementById("detailMeta"),
      policyBox: document.getElementById("policyBox"),
      evidenceList: document.getElementById("evidenceList"),
      auditList: document.getElementById("auditList"),
      evidenceForm: document.getElementById("evidenceForm"),
      evidenceType: document.getElementById("evidenceType"),
      evidenceRef: document.getElementById("evidenceRef"),
      evidenceNotes: document.getElementById("evidenceNotes"),
      formError: document.getElementById("formError"),
      submitBtn: document.getElementById("submitBtn"),
      approveBtn: document.getElementById("approveBtn"),
      rejectBtn: document.getElementById("rejectBtn"),
      archiveBtn: document.getElementById("archiveBtn"),
      exportBtn: document.getElementById("exportBtn")
    };

    function nowStamp() {
      const d = new Date();
      return d.toISOString().slice(0, 16).replace("T", " ");
    }

    function selectedItem() {
      return state.items.find(i => i.id === state.selectedId);
    }

    function policyCheck(item) {
      const issues = [];
      if (item.evidence.length < 2) issues.push("At least 2 evidence records are required.");
      if (item.dueDate < todayIso) issues.push("Due date has already passed.");
      if (item.status === "Archived") issues.push("Archived items cannot change workflow state.");
      return { pass: issues.length === 0, issues };
    }

    function can(role, action) {
      const matrix = {
        Analyst: ["submit"],
        Approver: ["approve", "reject"],
        Admin: ["submit", "approve", "reject", "archive"]
      };
      return matrix[role]?.includes(action);
    }

    function logAudit(item, action) {
      item.audit.unshift({ at: nowStamp(), actor: state.role, action });
    }

    function filteredItems() {
      const s = el.searchInput.value.trim().toLowerCase();
      let rows = state.items.filter(i => {
        const statusOk = !el.statusFilter.value || i.status === el.statusFilter.value;
        const riskOk = !el.riskFilter.value || i.risk === el.riskFilter.value;
        const searchOk = !s || [i.checklist, i.owner, i.regulation, i.team].join(" ").toLowerCase().includes(s);
        return statusOk && riskOk && searchOk;
      });

      const mode = el.sortBy.value;
      if (mode === "dueAsc") rows.sort((a, b) => a.dueDate.localeCompare(b.dueDate));
      if (mode === "riskDesc") rows.sort((a, b) => riskWeight[b.risk] - riskWeight[a.risk]);
      if (mode === "nameAsc") rows.sort((a, b) => a.checklist.localeCompare(b.checklist));
      return rows;
    }

    function statusBadge(status) {
      const map = {
        Draft: "bg-slate-700 text-slate-100",
        "Under Review": "bg-blue-700/60 text-blue-100",
        Approved: "bg-emerald-700/60 text-emerald-100",
        Rejected: "bg-rose-700/60 text-rose-100",
        Archived: "bg-amber-700/60 text-amber-100"
      };
      return `<span class="px-2 py-1 rounded text-xs ${map[status] || "bg-slate-700"}">${status}</span>`;
    }

    function renderList() {
      const rows = filteredItems();
      el.listCount.textContent = `${rows.length} checklist item(s)`;
      el.checklistList.innerHTML = rows.map(i => {
        const active = i.id === state.selectedId;
        return `
          <button data-id="${i.id}" class="w-full text-left border rounded-lg p-3 transition ${active ? "border-emerald-400 bg-slate-800" : "border-slate-800 bg-slate-950 hover:border-slate-600"}">
            <div class="flex justify-between gap-2">
              <div class="font-medium text-sm leading-5">${i.checklist}</div>
              ${statusBadge(i.status)}
            </div>
            <div class="text-xs text-slate-400 mt-2">${i.regulation} • ${i.owner} • Due ${i.dueDate}</div>
            <div class="text-xs mt-1 ${i.risk === "Critical" ? "text-rose-300" : "text-slate-400"}">Risk: ${i.risk}</div>
          </button>
        `;
      }).join("");

      el.checklistList.querySelectorAll("button[data-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.selectedId = Number(btn.dataset.id);
          render();
        });
      });
    }

    function renderDetail() {
      const item = selectedItem();
      if (!item) {
        el.emptyState.classList.remove("hidden");
        el.detailSection.classList.add("hidden");
        return;
      }

      el.emptyState.classList.add("hidden");
      el.detailSection.classList.remove("hidden");
      el.detailTitle.textContent = item.checklist;
      el.detailMeta.textContent = `${item.regulation} • Owner: ${item.owner} • Team: ${item.team} • Due: ${item.dueDate} • Risk: ${item.risk}`;

      const policy = policyCheck(item);
      el.policyBox.className = `border rounded-lg p-3 text-sm ${policy.pass ? "border-emerald-700 bg-emerald-950/30 text-emerald-200" : "border-amber-700 bg-amber-950/30 text-amber-100"}`;
      el.policyBox.innerHTML = policy.pass
        ? "✅ Policy validation passed. Item can move to approval states."
        : `⚠️ Policy validation failed:<ul class="list-disc ml-5 mt-1">${policy.issues.map(i => `<li>${i}</li>`).join("")}</ul>`;

      el.evidenceList.innerHTML = item.evidence.length
        ? item.evidence.map(e => `<li class="border border-slate-800 rounded p-2"><div class="font-medium">${e.type} <span class="text-slate-400">(${e.ref})</span></div><div class="text-xs text-slate-400 mt-1">${e.notes || "No notes"} • ${e.at}</div></li>`).join("")
        : `<li class="text-slate-400 text-sm">No evidence yet.</li>`;

      el.auditList.innerHTML = item.audit.map(a => `<li class="border-l-2 border-slate-700 pl-2"><span class="text-slate-400">${a.at}</span> • <span class="text-slate-100">${a.actor}</span> — ${a.action}</li>`).join("");

      el.submitBtn.disabled = !can(state.role, "submit") || !["Draft", "Rejected"].includes(item.status);
      el.approveBtn.disabled = !can(state.role, "approve") || item.status !== "Under Review" || !policy.pass;
      el.rejectBtn.disabled = !can(state.role, "reject") || item.status !== "Under Review";
      el.archiveBtn.disabled = !can(state.role, "archive") || ["Draft", "Under Review"].includes(item.status) || item.status === "Archived";

      [el.submitBtn, el.approveBtn, el.rejectBtn, el.archiveBtn].forEach(b => {
        b.classList.toggle("opacity-40", b.disabled);
        b.classList.toggle("cursor-not-allowed", b.disabled);
      });
    }

    function updateStatus(newStatus, actionText) {
      const item = selectedItem();
      if (!item) return;
      item.status = newStatus;
      logAudit(item, actionText);
      render();
    }

    function exportCsv() {
      const rows = filteredItems();
      const headers = ["Checklist", "Regulation", "Owner", "Team", "Risk", "Due Date", "Status", "Evidence Count"];
      const csv = [headers.join(",")].concat(rows.map(r => [r.checklist, r.regulation, r.owner, r.team, r.risk, r.dueDate, r.status, r.evidence.length].map(v => `"${String(v).replaceAll('"', '""')}"`).join(","))).join("\n");

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "compliance-checklist-export.csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function render() {
      renderList();
      renderDetail();
    }

    el.roleSelect.addEventListener("change", () => {
      state.role = el.roleSelect.value;
      renderDetail();
    });

    [el.searchInput, el.statusFilter, el.riskFilter, el.sortBy].forEach(i => i.addEventListener("input", renderList));

    el.evidenceForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const item = selectedItem();
      if (!item) return;

      if (!el.evidenceType.value || el.evidenceRef.value.trim().length < 4) {
        el.formError.textContent = "Please choose a type and provide a reference ID with at least 4 characters.";
        el.formError.classList.remove("hidden");
        return;
      }
      el.formError.classList.add("hidden");

      const newEvidence = {
        type: el.evidenceType.value,
        ref: el.evidenceRef.value.trim().toUpperCase(),
        notes: el.evidenceNotes.value.trim(),
        at: nowStamp()
      };
      item.evidence.unshift(newEvidence);
      logAudit(item, `Added evidence ${newEvidence.ref}`);
      el.evidenceForm.reset();
      renderDetail();
    });

    el.submitBtn.addEventListener("click", () => updateStatus("Under Review", "Submitted for review"));
    el.approveBtn.addEventListener("click", () => updateStatus("Approved", "Approved"));
    el.rejectBtn.addEventListener("click", () => updateStatus("Rejected", "Rejected"));
    el.archiveBtn.addEventListener("click", () => updateStatus("Archived", "Archived after closure"));
    el.exportBtn.addEventListener("click", exportCsv);

    state.selectedId = state.items[0].id;
    render();
  </script>
</body>
</html>
